<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="segShield" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="segInner" x1="16" y1="12" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="segCoin" x1="38" y1="38" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="segShadow" x="4" y="4" width="56" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Main Shield Shape -->
  <g filter="url(#segShadow)">
    <path d="M32 6L10 15V31C10 44.8 19.38 57.65 32 61C44.62 57.65 54 44.8 54 31V15L32 6Z" fill="url(#segShield)" stroke="#93c5fd" stroke-width="2"/>
    <!-- Inner faceted shield -->
    <path d="M32 11L15 18.5V30.5C15 41.5 22.3 51.8 32 55.5C41.7 51.8 49 41.5 49 30.5V18.5L32 11Z" fill="url(#segInner)" opacity="0.9"/>
    <!-- Central Protected Checkmark -->
    <path d="M22 32L29 39L43 25" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Golden Guarantee Coin on bottom right -->
  <circle cx="48" cy="48" r="11" fill="url(#segCoin)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="48" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#78350f">R$</text>
</svg>
