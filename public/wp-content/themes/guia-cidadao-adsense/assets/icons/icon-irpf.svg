<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="irpfWallet" x1="8" y1="14" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="irpfBill" x1="12" y1="8" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="irpfCoin" x1="38" y1="36" x2="60" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="irpfBadge" x1="36" y1="36" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="irpfShadow" x="4" y="6" width="56" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Money Bills sticking out of wallet -->
  <g filter="url(#irpfShadow)">
    <rect x="14" y="8" width="34" height="22" rx="4" transform="rotate(-8 14 8)" fill="url(#irpfBill)" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="28" cy="18" r="4" fill="#ffffff" opacity="0.6"/>
    <!-- Dark Navy Wallet -->
    <rect x="8" y="18" width="46" height="38" rx="8" fill="url(#irpfWallet)" stroke="#3b82f6" stroke-width="2"/>
    <!-- Wallet Stitching -->
    <line x1="12" y1="23" x2="50" y2="23" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Wallet Flap / Clip -->
    <path d="M40 30H54V44H40C36.69 44 34 41.31 34 38C34 34.69 36.69 30 40 30Z" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="46" cy="37" r="3" fill="#fbbf24"/>
  </g>
  <!-- Zero Tax / Isenção Badge -->
  <circle cx="48" cy="48" r="13" fill="url(#irpfBadge)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="48" y="52.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">0%</text>
</svg>
