<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ferSun" x1="8" y1="8" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ferCal" x1="12" y1="16" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="ferHeader" x1="12" y1="14" x2="52" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ferBadge" x1="34" y1="36" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="ferShadow" x="4" y="4" width="56" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- Background Radiant Sun -->
  <circle cx="22" cy="18" r="14" fill="url(#ferSun)"/>
  <!-- Calendar Body -->
  <g filter="url(#ferShadow)">
    <rect x="12" y="16" width="40" height="42" rx="7" fill="url(#ferCal)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Top red/orange calendar bar -->
    <path d="M12 23C12 19.13 15.13 16 19 16H45C48.87 16 52 19.13 52 23V26H12V23Z" fill="url(#ferHeader)"/>
    <!-- Calendar Rings -->
    <rect x="20" y="12" width="4" height="8" rx="2" fill="#475569"/>
    <rect x="40" y="12" width="4" height="8" rx="2" fill="#475569"/>
    <!-- Calendar Grid / Days -->
    <circle cx="21" cy="33" r="2.5" fill="#94a3b8"/>
    <circle cx="32" cy="33" r="2.5" fill="#94a3b8"/>
    <circle cx="43" cy="33" r="2.5" fill="#94a3b8"/>
    <circle cx="21" cy="42" r="2.5" fill="#94a3b8"/>
    <circle cx="32" cy="42" r="2.5" fill="#f97316"/>
    <circle cx="21" cy="50" r="2.5" fill="#94a3b8"/>
  </g>
  <!-- Highlighted "+1/3" Constitutional Badge -->
  <circle cx="48" cy="48" r="13" fill="url(#ferBadge)" stroke="#ffffff" stroke-width="2.5"/>
  <text x="48" y="53" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">+⅓</text>
</svg>
