<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="calGrad" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="calShadow" x="4" y="6" width="56" height="56" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#calShadow)">
    <rect x="10" y="12" width="44" height="46" rx="8" fill="url(#calGrad)" stroke="#bbf7d0" stroke-width="2"/>
    <!-- Top Green Header with 2026 -->
    <path d="M10 20C10 15.58 13.58 12 18 12H46C50.42 12 54 15.58 54 20V24H10V20Z" fill="#16a34a"/>
    <!-- Hanging rings -->
    <rect x="18" y="8" width="5" height="8" rx="2.5" fill="#15803d"/>
    <rect x="41" y="8" width="5" height="8" rx="2.5" fill="#15803d"/>
    <!-- Text 2026 -->
    <text x="32" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" letter-spacing="1">2026</text>
    <!-- Days Matrix -->
    <circle cx="20" cy="32" r="2.5" fill="#86efac"/>
    <circle cx="32" cy="32" r="2.5" fill="#86efac"/>
    <circle cx="44" cy="32" r="2.5" fill="#86efac"/>
    <circle cx="20" cy="41" r="2.5" fill="#86efac"/>
    <circle cx="32" cy="41" r="3.5" fill="#16a34a"/>
    <circle cx="44" cy="41" r="2.5" fill="#86efac"/>
    <circle cx="20" cy="50" r="2.5" fill="#86efac"/>
  </g>
  <!-- Currency / Payment indicator badge -->
  <circle cx="48" cy="48" r="11" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
  <text x="48" y="52.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff">NIS</text>
